name: E2E Tests (Playwright)

on: [push, pull_request]

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      proxy:
        image: python:3.11
        ports: ['5000:5000']
        options: >-
          --health-cmd "python -c 'import urllib.request, sys; urllib.request.urlopen(\"http://127.0.0.1:5000/health\")'" 
          --health-interval 5s --health-timeout 3s --health-retries 5
        # start proxy server in service container
        env:
          PYTHONUNBUFFERED: 1
        volumes: []
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies (Node)
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Install Python deps
        run: |
          python -m pip install -r requirements.txt || true

      - name: Build app
        run: npm run build

      - name: Start preview server
        run: npm run preview &

      - name: Start proxy server
        run: |
          python proxy-server/yfinance_api.py &
          sleep 2

      - name: Wait for servers
        run: |
          for i in {1..15}; do curl -sSf http://127.0.0.1:5173 && break || sleep 1; done
          for i in {1..15}; do curl -sSf http://127.0.0.1:5000/health && break || sleep 1; done

      - name: Run Playwright tests
        run: npx playwright test --forbid-only
        continue-on-error: false

      - name: Upload artifacts (screenshots)
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e/test-results/**/trace.zip,artifacts/*.png
